name: Build Scanner APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # 1. Создаем папку www и копируем туда index.html из корня
    - name: Prepare Web Directory
      run: |
        mkdir -p www
        cp index.html www/index.html

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    # 2. Робот сам создает настройки проекта
    - name: Create Config Files
      run: |
        cat > package.json << 'EOF'
        {
          "name": "scanner-app",
          "version": "1.0.0",
          "dependencies": {
            "@capacitor/android": "^6.0.0",
            "@capacitor/camera": "^6.0.0",
            "@capacitor/core": "^6.0.0",
            "@capacitor/filesystem": "^6.0.0",
            "@capacitor/share": "^6.0.0"
          },
          "devDependencies": {
            "@capacitor/cli": "^6.0.0",
            "@capacitor/assets": "^3.0.5"
          }
        }
        EOF

        cat > capacitor.config.json << 'EOF'
        {
          "appId": "com.tecno.scanner",
          "appName": "Сканер PRO",
          "webDir": "www",
          "server": {
            "androidScheme": "https"
          }
        }
        EOF

    - name: Install dependencies
      run: npm install

    - name: Add Android platform
      run: npx cap add android

    - name: Sync Capacitor
      run: npx cap sync

    # 3. Генерация иконки из файла icon.png
    - name: Prepare Icons
      run: |
        mkdir -p assets
        if [ -f "icon.png" ]; then mv icon.png assets/icon.png; fi

    - name: Generate App Icons
      run: npx @capacitor/assets generate --android --iconBackgroundColor '#ffffff' --iconBackgroundColorDark '#000000'

    # 4. Вшиваем разрешения (Камера, Микрофон, Галерея)
    - name: Inject All Permissions
      run: |
        sed -i '/<application/i \    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.INTERNET" />' android/app/src/main/AndroidManifest.xml

    # 5. МЕНЯЕМ СИСТЕМНОЕ НАЗВАНИЕ ПРИЛОЖЕНИЯ НА "Сканер PRO"
    - name: Set App Name
      run: |
        sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">Сканер PRO<\/string>/' android/app/src/main/res/values/strings.xml
        sed -i 's/<string name="title_activity_main">.*<\/string>/<string name="title_activity_main">Сканер PRO<\/string>/' android/app/src/main/res/values/strings.xml

    # 6. Сборка APK
    - name: Build APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    # 7. Выгрузка готового файла
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Scanner-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
